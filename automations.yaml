- id: '1769292243001'
  alias: Sterowanie zaworem przez przycisk
  triggers:
  - entity_id: sensor.akcja_przycisk
    trigger: state
  actions:
  - choose:
    - conditions:
      - condition: state
        entity_id: sensor.akcja_przycisk
        state: single_click
      sequence:
      - action: switch.toggle
        target:
          entity_id:
          - switch.zawor_wody_stan
        data: {}
    - conditions:
      - condition: state
        entity_id: sensor.akcja_przycisk
        state: double_click
      sequence:
      - action: switch.turn_on
        target:
          entity_id:
          - switch.zawor_wody_stan
        data: {}
- id: auto_off_valve
  alias: Auto-wyłączenie zaworu wody po 15 minutach
  description: Automatycznie wyłącza zawór wody po 15 minutach od włączenia.
  triggers:
  - trigger: state
    entity_id: switch.zawor_wody_stan
    to: 'on'
  actions:
  - wait_for_trigger:
    - trigger: state
      entity_id:
      - switch.zawor_wody_stan
      to:
      - 'on'
      for:
        hours: 0
        minutes: 1
        seconds: 0
    timeout:
      minutes: 15
    continue_on_timeout: true
    alias: Wait for 15mins
  - action: switch.turn_off
    target:
      entity_id: switch.zawor_wody_stan
    data: {}
  mode: restart
